# WRITE YOUR LEGISLATORS page.
#
# These are FACTS people can point to, not sentences for them to copy.
# Every fact needs a link. Letters should be in each person's own words.

facts:
  - id: permit
    fact: >-
      NJDEP's draft air permit covers 12 Caterpillar diesel generators (about
      43 MW). It sets emission limits but requires no routine monitoring or
      testing of those emissions. NJDEP can request testing but isn't
      required to.
    link_label: Draft air permit
    url: https://docs.stopnjdatacenters.org/2026-08-draft-air-permit-pcp250001.pdf
  - id: installed
    fact: >-
      The draft permit's equipment list shows installation dates between
      March and June 2026 for 8 of the 12 generators, before any permit was
      issued.
    link_label: Draft air permit, Equipment Inventory
    url: https://docs.stopnjdatacenters.org/2026-08-draft-air-permit-pcp250001.pdf
  - id: notice
    fact: >-
      When public notice is required, state law requires mailing it only to
      property owners within 200 feet, plus a newspaper notice, 10 days
      before the hearing. Some site plan applications need no notice at all.
    link_label: N.J.S.A. 40:55D-12
    url: https://law.justia.com/codes/new-jersey/2022/title-40/section-40-55d-12/
  - id: noise
    fact: >-
      New Jersey's noise rule sets limits on low frequencies (down to 31.5 Hz).
      We don't know whether the project's noise study tested them.
    link_label: N.J.A.C. 7:29-1.2
    url: https://www.law.cornell.edu/regulations/new-jersey/N-J-A-C-7-29-1-2
  - id: vineland
    fact: >-
      In September 2026, NJDEP fined DataOne, the company behind the Vineland
      data center, about $1 million for installing 62 generators without
      permits.
    link_label: New Jersey Monitor
    url: https://newjerseymonitor.com/2026/09/22/nj-vineland-data-center-fined/
  - id: tenant
    fact: >-
      No tenant or end user for the facility has been publicly identified,
      as far as we can find.
    link_label: Our public records list
    url: https://stopnjdatacenters.org/documents/
  - id: fairshare
    fact: >-
      On July 7, 2026, Governor Sherrill signed the Data Center Fair Share
      law (S731/A796), which makes data centers pay for the energy and grid
      infrastructure they use.
    link_label: Office of the Governor
    url: https://www.nj.gov/governor/news/2026/20260707a.shtml

# Short phrases people can tick in the letter starter. Keep them short.
asks:
  - Oppose this project
  - Require notice to everyone within a project's foreseeable impacts
  - Require emissions monitoring and testing for backup generators
  - Set enforceable limits on low-frequency noise
  - Require disclosure of who will own and use these facilities
  - Require large data centers to use clean power


governor:
  name: Governor Mikie Sherrill
  form_url: https://www.nj.gov/governor/contact/

find_legislators_url: https://njleg.gov/legislative-roster
