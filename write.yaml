# WRITE YOUR LEGISLATORS page.
#
# These are FACTS people can point to, not sentences for them to copy.
# Every fact needs a link. Letters should be in each person's own words.

facts:
  - id: permit
    fact: >-
      NJDEP's draft air permit covers 12 Caterpillar diesel generators (about
      43 MW). It sets emission limits but requires no routine monitoring or
      testing of those emissions. NJDEP can request testing but isn't
      required to.
    link_label: Draft air permit
    url: https://docs.stopnjdatacenters.org/2026-08-draft-air-permit-pcp250001.pdf
  - id: installed
    fact: >-
      Sentinel filed a notice that let it install the generators before the
      permit, as long as they don't run. Its consultant's notes say the
      installation includes electrical and exhaust connections.
    link_label: NJDEP emails, pp. 546–548
    url: https://docs.stopnjdatacenters.org/2026-10-key-emails-excerpt.pdf#page=19
  - id: notice
    fact: >-
      When public notice is required, state law requires mailing it only to
      property owners within 200 feet, plus a newspaper notice, 10 days
      before the hearing. Some site plan applications need no notice at all.
    link_label: N.J.S.A. 40:55D-12
    url: https://law.justia.com/codes/new-jersey/2022/title-40/section-40-55d-12/
  - id: noise
    fact: >-
      The developer's noise study never modeled the generators at full power,
      and gives no low-frequency results. With all generators at half power,
      it predicts levels at the nearest homes above the state's nighttime
      limit. Emergency generator noise is exempt from the rules.
    link_label: Noise study, October 18, 2024, pp. 2, 4, and 7
    url: https://docs.stopnjdatacenters.org/2024-10-18-lsga-acoustical-evaluation.pdf#page=7
  - id: vineland
    fact: >-
      In a separate case, NJDEP fined DataOne, the company behind a Vineland
      data center, about $1 million in September 2026 for installing 62
      generators without permits. DataOne is a different company.
    link_label: New Jersey Monitor
    url: https://newjerseymonitor.com/2026/09/22/nj-vineland-data-center-fined/
  - id: tenant
    fact: >-
      Bloomberg confirmed in October 2026 that it is the data center's
      tenant. NJDEP's tank registration also lists Bloomberg L.P. as operator
      of the facility's diesel tanks.
    link_label: Patch, October 28, 2026
    url: https://patch.com/new-jersey/southbrunswick/35095474/global-media-giant-confirms-it-s-behind-south-brunswick-data-center
  - id: phase1
    fact: >-
      The developer told the township that the 12 generators under review
      are "Phase 1," with "additional generators in future phases." Its
      representative told the Planning Board the total is 20.
    link_label: Developer's letter, March 17, 2026
    url: https://docs.stopnjdatacenters.org/2026-03-17-russo-letter-to-township-generators-phase-1.pdf
  - id: formaldehyde
    fact: >-
      Sentinel's own modeling found formaldehyde at 3.7 times the state's
      health threshold when all 12 generators run. The permit's testing
      limits were set to get under the threshold, and they don't apply in
      emergencies.
    link_label: How the testing limits were set
    url: https://stopnjdatacenters.org/south-brunswick/#limits
  - id: fairshare
    fact: >-
      On July 7, 2026, Governor Sherrill signed the Data Center Fair Share
      law (S731/A796). The Governor's office says it makes data centers pay
      for their own energy use and grid infrastructure, and "requires data
      centers to cut back before residential ratepayers are impacted."
    link_label: Office of the Governor
    url: https://www.nj.gov/governor/news/2026/20260707a.shtml

# Short phrases people can tick in the letter starter. Keep them short.
asks:
  - Oppose this project
  - Require notice to everyone within a project's foreseeable impacts
  - Require emissions monitoring and testing for backup generators
  - Set enforceable limits on low-frequency noise
  - Require disclosure of who will own and use these facilities
  - Require large data centers to use clean power


governor:
  name: Governor Mikie Sherrill
  form_url: https://www.nj.gov/governor/contact/

find_legislators_url: https://njleg.gov/legislative-roster
