# One entry per local fight. Right now there is only South Brunswick.
#
# RULE: every fact needs a source. Put the source in the "sources" list at the
# bottom of the campaign, then refer to it by its id (e.g. source: patch-petition).
# If we can't source it, it doesn't go on the site.

south-brunswick:
  id: south-brunswick
  name: South Brunswick
  project: The data center at 4405 US Route 1
  summary: >-
    A data center of roughly 341,000 square feet is being developed on the former
    Princeton Nurseries site at 4405 US Route 1 in South Brunswick. The township
    Planning Board approved it in May 2025.

  # Key facts, shown as a list on the South Brunswick page.
  facts:
    - label: Nearest home
      text: About 150 feet (45 meters) north of the facility
      source: risk-report
    - label: Location
      text: 4405 US Route 1, South Brunswick (Middlesex County)
      map: https://www.google.com/maps/search/?api=1&query=4405+US+Route+1+South+Brunswick+NJ
      source: draft-air-permit
    - label: Site
      text: About 143 acres of the former Princeton Nurseries site
      source: patch-petition
    - label: Building size
      text: About 341,000 square feet
      source: princeton-perspectives

  # Who's who. One line each, shown collapsed under "At a glance."
  who:
    - name: Sentinel Data Centers
      text: The developer named on the state's draft air permit.
      source: draft-air-permit
    - name: WRV Nurseries South Brunswick LLC
      text: Applied to the township to build the data center.
      source: dcd
    - name: Russo Development
      text: Wrote to the township on the applicant's behalf, calling the 12 generators "Phase 1."
      source: russo-letter
    - name: ALL4
      text: Sentinel's consultant, which wrote the health risk report.
      source: risk-report
    - name: Bloomberg L.P.
      text: The data center's tenant, which Bloomberg confirmed in October 2026. Also listed as operator of the fuel tanks.
      source: patch-bloomberg
    - name: NJDEP
      text: The New Jersey Department of Environmental Protection, which decides the air permit.

  # Concerns about this specific site. Keep each one tied to a source.
  concerns:
    - title: Runoff
      area: land
      text: >-
        A tributary of Heathcote Brook is on the southwest part of the site,
        near wetlands and the Millstone River
        ([Planning Board, p. 11](https://docs.stopnjdatacenters.org/2025-04-23-pb-resolution-preliminary-site-plan.pdf#page=11);
        [Sierra Club](https://www.sierraclub.org/sites/default/files/2025-03/resolution-regarding-a-proposed-data-center-at-the-princeton-nurseries-redevelopemt-property_0.pdf)).
        The site sits on soil contaminated with the banned pesticide dieldrin,
        most of which will stay in place under the building and pavement
        ([pp. 20–22](https://docs.stopnjdatacenters.org/2025-04-23-pb-resolution-preliminary-site-plan.pdf#page=20)). Up to 410,000 gallons of diesel will be
        stored underground ([tank registration](https://docs.stopnjdatacenters.org/2025-11-21-njdep-ust-registration-summary.pdf)). The township approved
        eight stormwater basins; we're asking how runoff and any fuel leaks
        will be kept out of the brook.
    - title: Contaminated berm
      area: land
      text: >-
        The existing berm near homes "consists of Dieldrin-impacted soil"
        capped with a foot of clean fill. The developer agreed to use only
        clean fill to extend it ([Planning Board, pp. 20–21](https://docs.stopnjdatacenters.org/2025-04-23-pb-resolution-preliminary-site-plan.pdf#page=20)).
    - title: Diesel generators and air quality
      area: air
      text: >-
        NJDEP's draft air permit covers twelve 3,620 kW diesel generators,
        about 43 MW. It sets limits on their emissions but requires no routine
        monitoring or testing of those emissions. Only hours of operation and
        fuel deliveries are tracked. NJDEP can request testing but isn't
        required to.
      source: draft-air-permit
    - title: Noise
      area: noise
      text: >-
        Mayor Carley says the approval sets sound wall heights and limits
        generator testing to daytime.
      source: princeton-perspectives

  # Timeline, oldest first.
  timeline:
    - date: 2025-03-26
      text: The Planning Board grants preliminary site plan approval.
      source: pb-prelim-site-plan
    - date: 2025-05
      text: South Brunswick approves the plans.
      source: patch-petition
    - date: 2026-03-17
      text: The developer tells the township the 12 generators are "Phase 1," with more planned.
      source: russo-letter
    - date: 2026-05-27
      text: NJDEP's draft risk memo finds formaldehyde at 3.7 times the state's threshold when all 12 generators run.
      source: njdep-risk-memo
    - date: 2026-08
      text: NJDEP drafts an air permit for the facility's 12 diesel generators, later released for public comment.
      source: draft-air-permit
    - date: 2026-09-23
      text: About 100 people attend a public meeting on a permit for the data center at the Princeton Marriott.
      source: tapinto-hearing
    - date: 2026-10
      text: At the request of Sen. Zwicker, Assemblywoman Drulis, and Assemblyman Freiman, NJDEP extends the comment period on the air permit to November 9, 2026.
      source: patch-extension

  # WHAT THE RECORDS SHOW. Shown at the top of the Records page.
  # Keep to five or fewer. Each one must link to the page that proves it.
    - date: 2026-10-28
      text: Bloomberg confirms it is the data center's tenant.
      source: patch-bloomberg
    - date: 2026-11-02
      text: Sen. Zwicker and Rep. Watson Coleman ask NJDEP not to issue the permit in its current form.
      source: princeton-info-halt
  findings:
    - title: The health numbers count only scheduled testing, and the cancer risk barely passes.
      text: >-
        9.86 in a million against a threshold of 10
        ([risk report, p. 30](https://docs.stopnjdatacenters.org/2026-03-pn-dc1-risk-assessment-report.pdf#page=30)). Outages and grid emergencies
        aren't counted ([how it works](/south-brunswick/#testing-only)).
    - title: The 12 generators are "Phase 1."
      text: >-
        The developer says more are planned
        ([letter](https://docs.stopnjdatacenters.org/2026-03-17-russo-letter-to-township-generators-phase-1.pdf)).
        Its representative told the Planning Board the total is 20
        ([p. 32](https://docs.stopnjdatacenters.org/2025-04-23-pb-resolution-preliminary-site-plan.pdf#page=32)).
    - title: The testing limits were fitted to pass a health test, and they cover testing only.
      text: >-
        [How it happened](/south-brunswick/#limits).
    - title: Bloomberg L.P. is the tenant.
      text: >-
        Bloomberg confirmed it in October 2026 ([Patch](https://patch.com/new-jersey/southbrunswick/35095474/global-media-giant-confirms-it-s-behind-south-brunswick-data-center)). NJDEP's
        tank registration already listed it as operator of the diesel tanks
        ([p. 6](https://docs.stopnjdatacenters.org/2025-11-21-njdep-ust-registration-summary.pdf#page=6)).
    - title: The nearest home is about 150 feet away.
      text: >-
        ([Risk report, p. 20](https://docs.stopnjdatacenters.org/2026-03-pn-dc1-risk-assessment-report.pdf#page=20))
    - title: Nine diesel tanks hold 410,000 gallons.
      text: >-
        Eight hold 50,000 gallons and one holds 10,000
        ([tank registration, pp. 1–5](https://docs.stopnjdatacenters.org/2025-11-21-njdep-ust-registration-summary.pdf#page=1)).
        The developer's letter to the township lists only the eight
        ([letter](https://docs.stopnjdatacenters.org/2026-03-17-russo-letter-to-township-generators-phase-1.pdf)).
    - title: The noise study never modeled the generators at full power.
      text: >-
        At half power, all generators together are predicted above the state's
        nighttime limit at the nearest homes; emergency noise is exempt
        ([noise study, pp. 4, 7](https://docs.stopnjdatacenters.org/2024-10-18-lsga-acoustical-evaluation.pdf#page=7)).

  # WHAT WE'RE ASKING FOR. Shown at the top of the Take Action page.
  demands:
    - title: Pause new data centers.
      text: >-
        Stop new approvals until New Jersey has rules that protect the people
        living next to them, starting with health tests that count emergency
        use.
    - title: No diesel generators.
      text: >-
        Require cleaner backup power. A data center isn't a hospital.
        Protecting equipment and shutting down safely is reasonable; keeping
        servers running on diesel through a multi-day outage isn't worth our
        air.
    - title: Until then, put "emergency" in writing.
      text: >-
        Cap all generator hours in the permit, emergencies included, and count
        them in the facility's total pollution. No running for grid programs
        or Fair Share demand cuts, and none on bad-air days except during
        power outages.
    - title: Measure it.
      text: Require emissions testing and public yearly reports of generator use.
    - title: Real noise limits for the whole facility.
      text: >-
        Enforceable limits on cooling equipment and generators alike,
        including low-frequency noise, with public monitoring at nearby homes.
    - title: Full disclosure.
      text: >-
        The tenant and owners, power and water use, the health risk
        assessment, and fuel storage.
    - title: Real notice.
      text: Notify everyone within the area of a project's foreseeable impacts, not just 200 feet.

  # Secondary actions, listed on the Take Action page. Keep these current.
  actions:
    - title: Sign the petition
      text: A South Brunswick resident's Change.org petition asks the township to stop the project.
      url: https://www.change.org/p/stop-the-proposed-data-center-development-in-south-brunswick-township
      button: Open the petition
    - title: Request public records
      text: >-
        Before you file an OPRA request, check our list of records we're
        looking for. Someone may already have asked. Pick one marked
        "Wanted," file it, and email us so we can mark it requested.
        Already have records, photos, or video? Send them too.
      url: /documents/
      button: See the records list
    - title: Watch for NJDEP air permit notices
      text: NJDEP posts public notices for air permits, including comment deadlines.
      url: https://dep.nj.gov/boss/public-notices/
      button: NJDEP public notices
    - title: Demand real notice for big projects
      text: >-
        When public notice is required, state law
        ([N.J.S.A. 40:55D-12](https://law.justia.com/codes/new-jersey/2022/title-40/section-40-55d-12/))
        requires mailing it only to property owners within 200 feet, plus a
        newspaper notice, 10 days before the hearing. Some site plan
        applications need no public notice at all. A large data center
        affects people far beyond its next-door neighbors. We're seeking reforms that require
        notice across the whole area of a project's foreseeable impacts.
      url: https://law.justia.com/codes/new-jersey/2022/title-40/section-40-55d-12/
      button: Read the notice law

