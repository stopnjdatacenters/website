# One entry per local fight. Right now there is only South Brunswick.
#
# RULE: every fact needs a source. Put the source in the "sources" list at the
# bottom of the campaign, then refer to it by its id (e.g. source: patch-petition).
# If we can't source it, it doesn't go on the site.

south-brunswick:
  id: south-brunswick
  name: South Brunswick
  project: The data center at 4405 US Route 1
  summary: >-
    A data center of roughly 341,000 square feet is being built on the former
    Princeton Nurseries site at 4405 US Route 1 in South Brunswick. The township
    Planning Board approved it in May 2025.

  # Key facts, shown as a list on the South Brunswick page.
  facts:
    - label: Location
      text: 4405 US Route 1, South Brunswick (Middlesex County), on the former Princeton Nurseries site
      source: compute-atlas
    - label: Site size
      text: About 143 acres
      source: patch-petition
    - label: Building size
      text: About 341,000 square feet
      source: princeton-perspectives
    - label: Developer
      text: Sentinel Data Centers. The applicant of record is WRV Nurseries South Brunswick Owner, LLC.
      source: compute-atlas
    - label: Approval
      text: Approved by South Brunswick in May 2025
      source: patch-petition
    - label: Status
      text: Listed as under construction, with completion targeted for the end of 2026, according to industry trackers
      source: compute-atlas

  # Concerns about this specific site. Keep each one tied to a source.
  concerns:
    - title: Contaminated soil
      text: >-
        The Sierra Club New Jersey Chapter says the property contains soil
        contaminated with dieldrin and chlordane, two pesticides now banned in
        the United States, and that construction could disturb capped soil berms.
      source: sierra-club
    - title: Water
      text: >-
        The Sierra Club resolution notes the site is near wetlands and the
        Millstone River, which it describes as a drinking water source for the region.
      source: sierra-club
    - title: Diesel generators and air quality
      text: >-
        NJDEP's draft air permit covers twelve 3,620 kW diesel generators,
        about 43 MW. It sets limits on their emissions but requires no
        monitoring of those emissions. Only hours of operation and fuel
        deliveries are tracked.
      source: draft-air-permit
    - title: Noise
      text: >-
        According to Mayor Carley, the approval requires sound walls and limits
        diesel generator testing to daytime hours. Residents will want to see
        how that is enforced.
      source: princeton-perspectives

  # Timeline, oldest first.
  timeline:
    - date: 2025-03
      text: Data center proposal announced for the former Princeton Nurseries site.
      source: compute-atlas
    - date: 2025-05
      text: South Brunswick approves the plans.
      source: patch-petition
    - date: 2026-08
      text: NJDEP releases a draft air permit for the facility's twelve diesel generators for public comment.
      source: draft-air-permit
    - date: 2026-09-23
      text: About 100 people attend a public meeting on a permit for the data center at the Princeton Marriott.
      source: tapinto-hearing

  # Things people can do right now. Keep these current.
  actions:
    - title: Write to your state legislators
      text: >-
        Senator Zwicker and Assembly members Drulis and Freiman represent
        South Brunswick. Tell them, in your own words, what this project
        means for you. We'll help you get started.
      url: /write/
      button: Write your letter
    - title: Sign the petition
      text: A South Brunswick resident's Change.org petition asks the township to stop the project.
      url: https://www.change.org/p/stop-the-proposed-data-center-development-in-south-brunswick-township
      button: Open the petition
    - title: Request public records
      text: >-
        Before you file an OPRA request, check our list of records we're
        looking for. Someone may already have asked. Pick one marked
        "Wanted," file it, and email us so we can mark it requested.
        Already have records, photos or video? Send them too.
      url: /documents/
      button: See the records list
    - title: Watch for NJDEP air permit notices
      text: NJDEP posts public notices for air permits, including comment deadlines.
      url: https://dep.nj.gov/boss/public-notices/
      button: NJDEP public notices
    - title: Ask for meetings to be streamed and archived
      text: >-
        Township meetings are [shown live only on local cable](https://southbrunswicknj.gov/access-a-live-meeting/)
        channels 26 and 45, with no online stream or archive we could find. In 2026, every
        Council and Planning Board meeting should be streamed online and
        kept for the public record.
      url: https://southbrunswicknj.gov/mayor-council/
      button: Contact the Mayor and Council
    - title: Demand real notice for big projects
      text: >-
        State law ([N.J.S.A. 40:55D-12](https://law.justia.com/codes/new-jersey/2022/title-40/section-40-55d-12/))
        only requires notifying property owners within 200 feet of a project,
        10 days before the hearing. A large data center affects people far
        beyond its next-door neighbors. We're seeking reforms that require
        notice across the whole area of a project's foreseeable impacts.
      url: https://law.justia.com/codes/new-jersey/2022/title-40/section-40-55d-12/
      button: Read the notice law
    - title: Join the conversation
      text: Updates, meeting reminders and discussion on our subreddit.
      url: https://www.reddit.com/r/StopNJDataCenters/
      button: Go to r/StopNJDataCenters

