- title: Planning Board resolution, preliminary site plan (adopted April 23, 2025)
  group: township
  agency: South Brunswick Planning Board
  type: Resolution
  date: 2025-04-23
  summary: 20 generators at full build-out, 400,000 gallons of diesel, and noise checked only after opening.
  description: >-
    The Board's 64-page written decision, summarizing every hearing,
    witness, and public comment. We removed residents' names and addresses.
  key_points:
    - >-
      The applicant's representative, Mr. Russo: "At a full build out of the facility there
      are 20 generators." (¶79,
      [p. 32](https://docs.stopnjdatacenters.org/2025-04-23-pb-resolution-preliminary-site-plan.pdf#page=32))
    - >-
      "Eight 50,000 gallon tanks, with a cumulative capacity of 400,000
      gallons are sized to provide approximately 72 hours of fuel." (¶23,
      [p. 15](https://docs.stopnjdatacenters.org/2025-04-23-pb-resolution-preliminary-site-plan.pdf#page=15))
    - >-
      Sentinel's sound engineer "confirmed that in an emergency situation,
      the noise regulations exempt generator noise." (¶73,
      [p. 30](https://docs.stopnjdatacenters.org/2025-04-23-pb-resolution-preliminary-site-plan.pdf#page=30))
    - >-
      Post-construction noise tests "shall not be a condition of final site
      plan approval, building permits, or a certificate of occupancy."
      ([p. 63](https://docs.stopnjdatacenters.org/2025-04-23-pb-resolution-preliminary-site-plan.pdf#page=63))
    - >-
      The Redevelopment Plan, as quoted by the Board: generators "should be
      used only in emergencies or for testing purposes," and a non-diesel
      fuel source "is encouraged." (Conclusion 9,
      [p. 41](https://docs.stopnjdatacenters.org/2025-04-23-pb-resolution-preliminary-site-plan.pdf#page=41))
    - >-
      Sentinel's acoustic engineers testified that octave-band
      (low-frequency) data was used; that octave-band letter has not been made public.
      (¶52–54, [pp. 24–25](https://docs.stopnjdatacenters.org/2025-04-23-pb-resolution-preliminary-site-plan.pdf#page=24))
    - >-
      Most of the dieldrin-contaminated topsoil will stay in place under the
      building and pavement as a cap. (¶39–44,
      [pp. 20–22](https://docs.stopnjdatacenters.org/2025-04-23-pb-resolution-preliminary-site-plan.pdf#page=20))
  open_questions:
    - >-
      The Board closed the hearing without hearing the neighbors' air
      emissions expert. (¶94–95,
      [pp. 35–36](https://docs.stopnjdatacenters.org/2025-04-23-pb-resolution-preliminary-site-plan.pdf#page=35))
  status: posted
  url: https://docs.stopnjdatacenters.org/2025-04-23-pb-resolution-preliminary-site-plan.pdf
  size: 17 MB
  campaign: south-brunswick

- title: Acoustical evaluation of the data center (Lewis S. Goodfriend & Associates, October 18, 2024)
  group: township
  agency: South Brunswick Planning Board (prepared for the developer)
  type: Report
  date: 2024-10-18
  summary: The noise study never modeled the generators at full power, and nighttime compliance at the hotels rests on a 1-decibel margin.
  description: >-
    The developer's noise consultant's report to the Planning Board. We
    removed one neighboring property's lot and block number.
  key_points:
    - >-
      It modeled all 20 generators of the full build-out, not the 12 in the
      air permit. ([p. 4](https://docs.stopnjdatacenters.org/2024-10-18-lsga-acoustical-evaluation.pdf#page=4))
    - >-
      The generator scenarios were one engine at full power, or all of them
      together at half power. No scenario has all generators at full power,
      the emergency case. ([p. 4](https://docs.stopnjdatacenters.org/2024-10-18-lsga-acoustical-evaluation.pdf#page=4))
    - >-
      With all generators at half power, it predicts 57 dB(A) at the nearest
      homes to the north: under the 65 daytime limit, but above the 50
      nighttime limit. The exemption covers generators "in use during an
      electrical outage." ([pp. 2, 7](https://docs.stopnjdatacenters.org/2024-10-18-lsga-acoustical-evaluation.pdf#page=7))
    - >-
      Constant equipment noise at the hotels to the east is predicted at 49
      dB(A) at night, against a limit of 50. That assumes only two of every
      three rooftop chillers run at once, with compressor covers on all of
      them. ([pp. 5, 7](https://docs.stopnjdatacenters.org/2024-10-18-lsga-acoustical-evaluation.pdf#page=5))
    - >-
      It reports only A-weighted results, which discount low frequencies. It
      lists the state's low-frequency limits but gives no results for them.
      The recommended silencers cut the least at 63 Hz.
      ([pp. 2, 4, 7](https://docs.stopnjdatacenters.org/2024-10-18-lsga-acoustical-evaluation.pdf#page=2))
    - >-
      Baseline sound was measured once, over 24 hours in late March, at 35 to
      52 degrees. ([p. 3](https://docs.stopnjdatacenters.org/2024-10-18-lsga-acoustical-evaluation.pdf#page=3))
  open_questions:
    - >-
      The developer's representative told the Planning Board the generators
      are tested "one at a time." The noise study evaluated testing all of
      them at once. Which is the plan?
      ([Planning Board resolution, p. 32](https://docs.stopnjdatacenters.org/2025-04-23-pb-resolution-preliminary-site-plan.pdf#page=32))
    - >-
      The figures are dated October 3, 2024, which suggests an earlier
      version. What changed?
      ([pp. 10–11](https://docs.stopnjdatacenters.org/2024-10-18-lsga-acoustical-evaluation.pdf#page=10))
  status: posted
  url: https://docs.stopnjdatacenters.org/2024-10-18-lsga-acoustical-evaluation.pdf
  size: 0.4 MB
  campaign: south-brunswick

