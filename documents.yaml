# PUBLIC RECORDS
#
# Every record we want, and where each one stands. One entry per record.
# Volunteers use the "Wanted" list to pick a record to request, so we
# don't file duplicate OPRA requests.
#
# NEVER put the name of the person who filed a request in this file.
# Keep that in the offline log.
#
# status is one of:
#   wanted    - nobody has requested it yet
#   requested - someone filed an OPRA request (fill in "requested")
#   received  - we have it and are reviewing it before posting
#   posted    - uploaded to R2 and available (fill in "url" and "size")
#   denied    - refused (fill in "denial_reason")
#
# Dates are written YYYY-MM-DD (e.g. 2026-10-02) or YYYY-MM (e.g. 2025-05).
#
# Fields:
#   title         what the record is
#   agency        who holds it (who to send the OPRA request to)
#   type          Site plan, Application, Resolution, Report, Minutes,
#                 Correspondence, Permit, Agreement, Other
#   date          date of the document itself, if known
#   description   one or two plain-English lines
#   key_question  optional: what we most want to learn from it.
#                 Links are written [like this](https://example.com)
#   key_points    optional list: what the document shows, with the
#                 document's own section/condition numbers
#   open_questions optional list: questions the document raises
#   requested     date the OPRA request was filed
#   due           optional: exact response deadline from the agency.
#                 If left out, the site counts 7 business days
#                 (weekends skipped, holidays not).
#   extended_to   optional: new deadline if the agency extends it
#   denial_reason the agency's stated reason (or "No response by deadline")
#   url           https://docs.stopnjdatacenters.org/ + file name
#   size          e.g. "2 MB"
#   campaign      south-brunswick
#
# Posting a document:
#   1. Redact residents' personal details (home addresses, phone numbers,
#      emails, signatures).
#   2. Name the file lowercase-with-dashes, date first:
#      2025-05-planning-board-resolution.pdf
#   3. Cloudflare: R2 > stopnjdatacenters-docs > Upload.
#   4. Here: set status to posted and fill in url and size.

# ---------- Posted ----------

- title: NJDEP draft air permit for the diesel generators (PCP250001)
  agency: NJDEP (Bureau of Stationary Sources)
  type: Permit
  date: 2026-08
  description: >-
    Draft preconstruction permit and certificate to operate for the
    facility's backup generators, released for public comment. The public
    comment period closed October 7, 2026.
  key_points:
    - >-
      Covers twelve 3,620 kW Caterpillar diesel generators, about 43 MW of
      generating capacity. (Section A; Equipment Inventory)
    - >-
      Sets hourly and annual limits for NOx, particulate matter, carbon
      monoxide, benzene, formaldehyde and other pollutants, but lists
      "None" as the monitoring and recordkeeping requirement for every one
      of those limits. (Section D, U1 OS Summary Ref. 3–16; OS1–OS12 Ref. 2–13)
    - >-
      What is tracked: hours of operation (hour meter and log) and fuel
      quality from delivery paperwork. (Section D, U1 OS Summary Ref. 1, 17, 18)
    - >-
      Compliance with engine emission standards is shown by keeping the
      manufacturer's certification. No stack testing is required.
      (Section D, OS1–OS12 Ref. 16, 21)
  open_questions:
    - >-
      The annual limits equal 12 engines × 28 testing hours × the hourly
      limit (for NOx: 12 × 28 × 75.28 lb ÷ 2,000 = 12.65 tons). Do they
      apply to emergency operation, which has no hourly cap? If so, how is
      compliance shown?
    - >-
      The Equipment Inventory lists installation dates between March and
      June 2026 for 8 of the 12 generators (the other 4 on November 1, 2026),
      before this draft permit. Were any generators installed before a
      permit was issued?
  status: posted
  url: https://docs.stopnjdatacenters.org/2026-08-draft-air-permit-pcp250001.pdf
  size: 0.9 MB
  campaign: south-brunswick

