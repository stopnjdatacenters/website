- title: Sentinel's risk assessment report (ALL4, March 2026)
  group: njdep
  agency: NJDEP (filed by PN-DC1 / ALL4)
  type: Report
  date: 2026-03
  summary: The company's own numbers show formaldehyde at 3.74 times the state's threshold when all 12 engines run.
  description: >-
    The air dispersion modeling and health risk assessment Sentinel's
    consultant filed with NJDEP. We removed the exact coordinates of the
    nearest home.
  key_points:
    - >-
      All 12 engines at full load for one hour: formaldehyde hazard quotient
      3.74 and acrolein 1.62, against a threshold of 1; 1.68 for formaldehyde
      at the nearest sensitive receptor, a hotel. (Table 6‑7,
      [p. 39](https://docs.stopnjdatacenters.org/2026-03-pn-dc1-risk-assessment-report.pdf#page=39))
    - >-
      The report calls that scenario one that "does not reflect any planned
      testing operations."
      ([p. 38](https://docs.stopnjdatacenters.org/2026-03-pn-dc1-risk-assessment-report.pdf#page=38))
    - >-
      The nearest home is 45 meters (about 150 feet) north of the facility.
      (Table 5‑1, [p. 20](https://docs.stopnjdatacenters.org/2026-03-pn-dc1-risk-assessment-report.pdf#page=20))
    - >-
      Diesel particulate cancer risk: 9.86 in a million, against a
      threshold of 10. (Table 6‑1,
      [p. 30](https://docs.stopnjdatacenters.org/2026-03-pn-dc1-risk-assessment-report.pdf#page=30))
  open_questions:
    - >-
      Added together, the cancer risks in Table 6‑1 come to about 10.6 in a
      million at the same spot. Does NJDEP's guidance require adding them?
  status: posted
  url: https://docs.stopnjdatacenters.org/2026-03-pn-dc1-risk-assessment-report.pdf
  size: 15 MB
  campaign: south-brunswick

